<section id="banner">
  <header>
    <h2>Blog</h2>
    <p>Psicologia, benessere psicofisico, formazione e neuroscienze — approfondimenti per capire e stare meglio.</p>
  </header>
</section>

<section id="main">
  <div class="container">
    <article class="box post">
      <header style="text-align: center; margin-bottom: 3em">
        <div id="categories" style="margin-top: 1.5em">
          <form action="#" (submit)="$event.preventDefault()" style="text-align: center; margin-bottom: 1em">
            <input
              type="text"
              [value]="search"
              (input)="setSearch(($any($event.target)).value)"
              id="blog-search"
              placeholder="Cerca nel blog..."
              style="width: 100%; max-width: 400px; display: inline-block"
            />
          </form>
          <ul class="actions small" style="justify-content: center">
            <li>
              <a
                href="#"
                (click)="$event.preventDefault(); setCategory('all')"
                class="button super-small filter-btn"
                [class.active]="category === 'all'"
                [class.alt]="category !== 'all'"
              >Tutti</a
              >
            </li>
            <li>
              <a
                href="#"
                (click)="$event.preventDefault(); setCategory('psicologia')"
                class="button super-small filter-btn"
                [class.active]="category === 'psicologia'"
                [class.alt]="category !== 'psicologia'"
              >Psicologia</a
              >
            </li>
            <li>
              <a
                href="#"
                (click)="$event.preventDefault(); setCategory('hr')"
                class="button super-small filter-btn"
                [class.active]="category === 'hr'"
                [class.alt]="category !== 'hr'"
              >HR</a
              >
            </li>
            <li>
              <a
                href="#"
                (click)="$event.preventDefault(); setCategory('ai')"
                class="button super-small filter-btn"
                [class.active]="category === 'ai'"
                [class.alt]="category !== 'ai'"
              >AI</a
              >
            </li>
            <li>
              <a
                href="#"
                (click)="$event.preventDefault(); setCategory('formazione')"
                class="button super-small filter-btn"
                [class.active]="category === 'formazione'"
                [class.alt]="category !== 'formazione'"
              >Formazione</a
              >
            </li>
            <li>
              <a
                href="#"
                (click)="$event.preventDefault(); setCategory('id')"
                class="button super-small filter-btn"
                [class.active]="category === 'id'"
                [class.alt]="category !== 'id'"
              >Instructional Design</a
              >
            </li>
          </ul>
        </div>
      </header>

      <div id="blog-list" class="row project-grid">
        <div class="col-6 col-12-medium project-item" *ngFor="let p of pagedPosts">
          <section class="box project-card compact-card">
            <header><h4>{{ p.title }}</h4></header>
            <a [routerLink]="['/blog', p.slug]" class="image centered small-img"><img [src]="p.image" [alt]="p.alt" /></a>
            <p style="font-size: 0.85em">{{ p.description }}</p>
            <footer><a [routerLink]="['/blog', p.slug]" class="button super-small">Leggi di più</a></footer>
          </section>
        </div>
      </div>

      <div class="pagination-container" style="margin-top: 3em; text-align: center">
        <ul class="pagination-list">
          <li>
            <a
              href="#"
              (click)="$event.preventDefault(); setPage(page - 1)"
              class="button super-small alt"
              [class.disabled]="page === 1"
            >Prev</a
            >
          </li>
          <div id="blog-page-numbers-list" style="display: flex; align-items: center">
            <li *ngFor="let p of pages()">
              <a
                href="#"
                (click)="$event.preventDefault(); setPage(p)"
                class="button super-small"
                [class.alt]="p !== page"
              >{{ p }}</a
              >
            </li>
          </div>
          <li>
            <a
              href="#"
              (click)="$event.preventDefault(); setPage(page + 1)"
              class="button super-small alt"
              [class.disabled]="page === totalPages"
            >Next</a
            >
          </li>
        </ul>
      </div>
    </article>
  </div>
</section>
