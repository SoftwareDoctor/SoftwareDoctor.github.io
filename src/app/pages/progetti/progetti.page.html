<section id="banner">
  <header>
    <h2>Instructional Design Portfolio</h2>
    <p>Creare esperienze di apprendimento efficaci e coinvolgenti</p>
  </header>
</section>

<section id="main">
  <div class="container">
    <article class="box post">
      <header style="text-align: center">
        <h2>I miei Progetti</h2>
        <p>Psicologo & Formatore, appassionato di Instructional Design</p>
      </header>

      <div id="project-list" class="row project-grid">
        <div class="col-6 col-12-medium project-item" *ngFor="let p of pagedProjects">
          <section class="box project-card compact-card">
            <header><h4>{{ p.title }}</h4></header>
            <a [href]="p.link || '#'" class="image centered small-img"><img [src]="p.image" [alt]="p.alt" /></a>
            <p style="font-size: 0.85em">{{ p.description }}</p>
            <footer><a [href]="p.link || '#'" class="button super-small">{{ p.cta }}</a></footer>
          </section>
        </div>
      </div>

      <div class="pagination-container" style="margin-top: 2em; text-align: center; display: flex; justify-content: center">
        <ul class="pagination-list">
          <li>
            <a
              href="#"
              (click)="$event.preventDefault(); setPage(page - 1)"
              class="button super-small alt"
              [class.disabled]="page === 1"
              >Prev</a
            >
          </li>
          <div id="page-numbers-list" style="display: flex; align-items: center; margin: 0">
            <li *ngFor="let p of pages()">
              <a
                href="#"
                (click)="$event.preventDefault(); setPage(p)"
                class="button super-small"
                [class.alt]="p !== page"
                >{{ p }}</a
              >
            </li>
          </div>
          <li>
            <a
              href="#"
              (click)="$event.preventDefault(); setPage(page + 1)"
              class="button super-small alt"
              [class.disabled]="page === totalPages"
              >Next</a
            >
          </li>
        </ul>
      </div>
    </article>
  </div>
</section>
